name: EU to UK Arbitrage Monitor

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours — adjust to your Keepa token budget
  workflow_dispatch: {}

concurrency:
  group: eu-uk-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests keepa

      - name: Run monitor
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python eu_uk_arbitrage_monitor.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_deals.json
          git diff --staged --quiet || git commit -m "Update seen deals [skip ci]"
          git pull --rebase origin main
          git push
